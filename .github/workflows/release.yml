name: Release Plugin

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # ghVersion uses commit count — needs full history (shallow clone miscounts)
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # Version injected at build time only — repo keeps placeholders (no write-back).
      # Trade-off: IINA's update check reads the placeholder and won't prompt.
      - name: Bump version and ghVersion in Info.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$' \
            || { echo "invalid tag: $TAG (expected 1.2.3 or 1.2.3-beta.1)"; exit 1; }

          # ghVersion: commit count (monotonic)
          GH_VERSION=$(git rev-list --count HEAD)

          jq --indent 4 --arg v "$VERSION" --argjson g "$GH_VERSION" \
            '.version = $v | .ghVersion = $g' Info.json > /tmp/Info.json.new
          mv /tmp/Info.json.new Info.json

          echo "Info.json -> $(jq -c '{version, ghVersion}' Info.json)"

      - name: Create plugin archive
        run: |
          echo "Tag: ${GITHUB_REF#refs/tags/}"

          # Remove macOS metadata files that Finder would normally hide
          find . -name '.DS_Store' -type f -delete
          rm -f node_modules/.package-lock.json

          # Pack all non-hidden files → IINA plugin archive (.iinaplgz)
          # (mirrors: Finder → Cmd+A → right-click → compress → rename to .iinaplgz)
          zip -r iina-plugin-danmaku.iinaplgz . \
            -x './.*' '*/.*'

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: iina-plugin-danmaku.iinaplgz
          generate_release_notes: true
